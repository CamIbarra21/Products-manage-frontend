<div class="card">
    <p-table [value]="stores">
        <ng-template #header>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Location</th>
                <th>Manager</th>
            </tr>
        </ng-template>
        <ng-template #body let-store>
            <tr>
                <td>{{ store.id }}</td>
                <td>{{ store.name }}</td>
                <td>{{ store.location }}</td>
                <td>{{ store.manager }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
