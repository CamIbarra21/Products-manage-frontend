<p-toast></p-toast>

<div class="form-section">
    <h2>Welcome</h2>

    <form [formGroup]="registerForm" (ngSubmit)="register()">
        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-id-card"></i>
            </p-inputgroup-addon>
            <input id="fullname" formControlName="fullname" pInputText placeholder="Fullname" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-at"></i>
            </p-inputgroup-addon>
            <input id="email" formControlName="email" pInputText placeholder="Email" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <input id="username" formControlName="username" pInputText placeholder="Username" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-key"></i>
            </p-inputgroup-addon>
            <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" placeholder="Password"/>
        </p-inputgroup>

        <button pButton>
            <i class="pi pi-arrow-up-right" pButtonIcon></i>
            <span pButtonLabel><b>REGISTER</b></span>
        </button>
    </form>

        
    <span class="spanLink" routerLink="/login" >Do you have an account?</span>

</div>
