<div class="stocks-section">
    <p-toast></p-toast>

    <p-tabs value="0">
        <p-tablist>
            <p-tab value="0">Find stock</p-tab>
            <p-tab value="1">New stock</p-tab>
            <p-tab value="2">Update stock</p-tab>
        </p-tablist>
        <p-tabpanels>
            <p-tabpanel value="0">
                    <form [formGroup]="searchForm" (ngSubmit)="searchStock()">
                        <p-inputgroup>
                            <p-inputgroup-addon>
                                <i class="pi pi-cart-arrow-down"></i>
                            </p-inputgroup-addon>
                            <p-select [options]="sourceStores" formControlName="selectedSearchStore" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true" placeholder="Select a Store" class="search-select-store">
                                <ng-template let-store #store>
                                    <span>{{ store.name }}</span>
                                </ng-template>
                            </p-select>

                        </p-inputgroup>

                        <p-inputgroup>
                            <p-inputgroup-addon>
                                <i class="pi pi-cart-arrow-down"></i>
                            </p-inputgroup-addon>
                            <p-select [options]="sourceProducts" formControlName="selectedSearchProduct" optionLabel="name" [filter]="true" filterBy="name" [showClear]="true" placeholder="Select a Store" class="search-select-store">
                                <ng-template let-product #product>
                                    <span>{{ product.name }}</span>
                                </ng-template>
                            </p-select>
                        </p-inputgroup>

                        <button pButton>
                            <i class="pi pi-arrow-up-right" pButtonIcon></i>
                            <span pButtonLabel><b>Search stock</b></span>
                        </button>
                    </form>
                    @if (searchSuccess) {
                        <div class="search-result">
                            <p-message severity="info">Stock for this product in this store is {{ searchResult }}</p-message>
                        </div>
                    }                    
            </p-tabpanel>

            <p-tabpanel value="1">
                <form [formGroup]="addForm" (ngSubmit)="addStock()">
                    <p-inputgroup>
                        <p-picklist
                            [source]="sourceStores"
                            [target]="targetStores"
                            [dragdrop]="true"
                            [responsive]="true"
                            filterBy="name"
                            sourceFilterPlaceholder="Search a store"
                            targetFilterPlaceholder="Search a store"
                            breakpoint="1400px"
                            scrollHeight="20rem"
                        >
                            <ng-template let-store let-selected="selected" #store>
                                {{ store.name }}
                            </ng-template>
                        </p-picklist>
                    </p-inputgroup>

                    <p-inputgroup>
                        <p-picklist
                            [source]="sourceProducts"
                            [target]="targetProducts"
                            [dragdrop]="true"
                            [responsive]="true"
                            filterBy="name"
                            sourceFilterPlaceholder="Search a product"
                            targetFilterPlaceholder="Search a product"
                            breakpoint="1400px"
                            scrollHeight="20rem"
                        >
                            <ng-template let-product let-selected="selected" #product>
                                {{ product.name }}
                            </ng-template>
                        </p-picklist>
                    </p-inputgroup>

                    <p-inputgroup>
                        <p-inputgroup-addon>
                            <i class="pi pi-cart-arrow-down"></i>
                        </p-inputgroup-addon>
                        <p-inputnumber formControlName="quantity"  [showButtons]="true" />
                    </p-inputgroup>

                    <button pButton>
                        <i class="pi pi-arrow-up-right" pButtonIcon></i>
                        <span pButtonLabel><b>Add stock</b></span>
                    </button>
                </form>
            </p-tabpanel>

            <p-tabpanel value="2">
                <p>
                    Updating stock
                </p>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>
</div>
