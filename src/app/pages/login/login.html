<p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"></p-toast>

<div class="login-section">
    <div class="form-section">
        <h2 class="text-2xl font-bold">Hi again</h2>

        <form [formGroup]="loginForm" (ngSubmit)="login()">
            <p-inputgroup>
                <p-inputgroup-addon>
                    <i class="pi pi-user"></i>
                </p-inputgroup-addon>
                <input id="username" formControlName="username" pInputText placeholder="Username" />
            </p-inputgroup>

            <p-inputgroup>
                <p-inputgroup-addon>
                    <i class="pi pi-key"></i>
                </p-inputgroup-addon>
                <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" placeholder="Password"/>
            </p-inputgroup>

            <button pButton>
                <i class="" pButtonIcon></i>
                <span class="" pButtonLabel><b>LOGIN</b></span>
            </button>
        </form>

        <span class="spanLink" routerLink="/register" >Don't have an account?</span>
    </div>

</div>
