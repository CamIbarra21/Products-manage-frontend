<p-toast></p-toast>

<div class="form-section">
    <h2>{{ isUpdate ? 'Update product' : 'New product' }}</h2>

    <form [formGroup]="productForm" (ngSubmit)="save()">
        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <input id="name" formControlName="name" pInputText placeholder="Product name" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <input id="description" formControlName="description" pInputText placeholder="Description" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <p-inputnumber id="price" 
            formControlName="price" 
            [showButtons]="true" 
            mode="currency" 
            currency="PEN" 
            locale="en-US"
            [minFractionDigits]="2"
            placeholder="Price" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <p-select formControlName="category" [options]="categories" placeholder="Category" class="w-full md:w-56" />
        </p-inputgroup>

        <p-inputgroup>
            <p-inputgroup-addon>
                <i class="pi pi-user"></i>
            </p-inputgroup-addon>
            <input id="imageLink" formControlName="imageLink" pInputText placeholder="Image link" />
        </p-inputgroup>

        <!--
        <div>
            <input type="text" pInputText [(ngModel)]="value"/>
            <p-slider [(ngModel)]="value" [min]="0" [max]="10" class="w-full" (onChange)="setFieldCount(value)"/>
        </div>-->


        <button pButton type="submit">
            <i class="pi pi-save" pButtonIcon></i>
            <span pButtonLabel><b>Save</b></span>
        </button>

        <button routerLink="/inside/products" pButton>
            <i class="pi pi-times" pButtonIcon></i>
            <span pButtonLabel><b>Cancel</b></span>
        </button>

    </form>
</div>
