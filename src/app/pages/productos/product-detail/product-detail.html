<div class="detail-container">
    <p-card>
        <ng-template #header>
            <div class="header-card">
                <p-image [alt]="product.name" [src]="product.imageLink" [preview]="true"/>
            </div>
        </ng-template>
        <ng-template #title> {{ product.name }} </ng-template>
        <ng-template #subtitle> {{ product.category }} </ng-template>
        <span><b>${{ product.price }}</b></span>

        <p>
            {{ product.description }}
        </p>
        <ng-template #footer>
            <div class="flex gap-4 mt-1">
                <p-button routerLink="/inside/products" label="Back" class="w-full" styleClass="w-full" />
            </div>
        </ng-template>
    </p-card>
</div>
