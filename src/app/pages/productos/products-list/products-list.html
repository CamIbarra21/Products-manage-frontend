<p-toast></p-toast>

<div class="card">
    <div class="mb-3">
        <p-button 
        label="Nuevo Producto" 
        icon="pi pi-plus" 
        routerLink="/inside/products/add" 
        severity="success" >
        </p-button>
    </div>

     <p-dataview #dv
        [value]="products"
    >
        <ng-template #list let-products>
            <div class="products-list">
                @for (product of products; track product) {
                    @if (!$first) {
                        <p-divider></p-divider>
                    }
                    <div class="product-item">
                        <div class="product-left-side">
                            <div class="image-side">
                                <img
                                    class="product-image"
                                    [src]="product.imageLink"
                                    [alt]="product.name"
                                />
                                <p-tag
                                    [value]="statusStock(product)"
                                    [style]="getSeverity(product)"
                                    class="product-tag"
                                />
                            </div>
                            <div class="text-section">
                                <span>{{ product.category }}</span>
                                <p>{{ product.name }}</p>
                            </div>
                        </div>
                        <div class="product-right-side">
                            <div class="pb-section">
                                <span class="price">{{
                                    '$' + product.price
                                }}</span>
                            </div>
                            <div class="buttons">
                                <td>
                                    <p-button icon="pi pi-eye" (click)="viewProduct(product)" severity="secondary" rounded />
                                </td>
                                <td>
                                    <p-button icon="pi pi-refresh" (click)="updateProduct(product)" severity="secondary" rounded />
                                </td>
                                <td>
                                    <p-button icon="pi pi-trash" (click)="deleteProduct(product)" severity="danger" rounded />
                                </td>
                            </div>
                        </div>
                    </div>
                }
                
            </div>
        </ng-template>

    </p-dataview>

    <div class="pagination">
        <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="totalProducts" [rowsPerPageOptions]="[5, 10, 20, 30]" />
    </div>
</div>
